services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_NAME:-gdgdb}
      MYSQL_USER: ${DB_USER:-gdg}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gdgpassword}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-gdg}
      DB_PASSWORD: ${DB_PASSWORD:-gdgpassword}
      DB_NAME: ${DB_NAME:-gdgdb}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
